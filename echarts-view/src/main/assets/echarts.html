<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ECharts</title>
    <script src="file:///android_asset/echarts.min.js"></script>
    <!-- Load all custom themes synchronously -->
    <script src="file:///android_asset/theme/infographic.js"></script>
    <script src="file:///android_asset/theme/macarons.js"></script>
    <script src="file:///android_asset/theme/roma.js"></script>
    <script src="file:///android_asset/theme/shine.js"></script>
    <script src="file:///android_asset/theme/vintage.js"></script>
</head>
<body>
<div id="main" style="width: 100%; height:100vh;"></div>
<script type="text/javascript">
    const urlParams = new URLSearchParams(window.location.search);
    const theme = urlParams.get('theme');
    var myChart = echarts.init(document.getElementById('main'), theme);

    myChart.on('click', function (params) {
        if (window.Android && typeof window.Android.onDataClick === 'function') {
            window.Android.onDataClick(params.name);
        }
    });

    function setChartOption(option) {
        option.darkMode = 'auto';
        myChart.setOption(option);
    }

    function updateTheme(newTheme) {
        if (newTheme === 'null') {
            newTheme = 'default';
        }
        myChart.setTheme(newTheme);
    }

    function resizeChart() {
        myChart.resize();
    }

    window.onresize = function() {
        myChart.resize();
    };
</script>
</body>
</html>
